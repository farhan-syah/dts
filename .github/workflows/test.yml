name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The README carries a pasteable copy of the rules. It drifts silently.
      - name: README block matches rules/dts.md
        run: python3 tools/sync-readme.py --check

      - name: Markdown links resolve
        run: python3 tools/links.py $(git ls-files '*.md')

      # The standard has to survive its own audit, or it is advice, not a rule.
      - name: Shipped prose passes the DTS lint
        run: python3 bench/lint.py $(git ls-files "*.md")

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: bash -n install.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bench/runall.sh bench/sync-arms.sh

      # install.sh edits a user's global agent config, so every check below runs
      # against a throwaway HOME holding a stub `claude` on PATH. Without the
      # stub no harness is detected, install.sh exits early, and the checks pass
      # by doing nothing.
      - name: Dry run writes nothing
        run: |
          HOME="$(mktemp -d)"; export HOME
          mkdir -p "$HOME/bin" "$HOME/.claude"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          export PATH="$HOME/bin:$PATH"
          printf '# my notes\nkeep this line\n' > "$HOME/.claude/CLAUDE.md"
          before="$(find "$HOME" | sort)"
          ./install.sh --dry-run --only claude
          after="$(find "$HOME" | sort)"
          if [ "$before" != "$after" ]; then
            echo "--dry-run changed the filesystem:"
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            exit 1
          fi
          grep -q 'dts:start' "$HOME/.claude/CLAUDE.md" && {
            echo "--dry-run wrote the rules block"; exit 1; }
          echo "dry run touched nothing"

      - name: Install, reinstall, uninstall round trip
        run: |
          HOME="$(mktemp -d)"; export HOME
          mkdir -p "$HOME/bin" "$HOME/.claude"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          export PATH="$HOME/bin:$PATH"
          printf '# my notes\nkeep this line\n' > "$HOME/.claude/CLAUDE.md"

          ./install.sh --only claude
          grep -q 'dts:start' "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/skills/dts/SKILL.md"
          test -f "$HOME/.claude/output-styles/dts.md"

          ./install.sh --only claude          # reinstall must not duplicate
          [ "$(grep -c 'dts:start' "$HOME/.claude/CLAUDE.md")" = 1 ]

          ./install.sh --only claude --uninstall
          grep -q 'keep this line' "$HOME/.claude/CLAUDE.md"
          ! grep -q 'dts:start' "$HOME/.claude/CLAUDE.md"
          ! test -d "$HOME/.claude/skills/dts"
          ! test -f "$HOME/.claude/output-styles/dts.md"

      # --print feeds a paste into any agent this script does not know.
      - name: Print emits a complete marked block
        run: |
          ./install.sh --print > /tmp/block.md
          grep -q '<!-- dts:start -->' /tmp/block.md
          grep -q '<!-- dts:end -->' /tmp/block.md
          diff <(sed '1d;$d' /tmp/block.md) rules/dts.md
